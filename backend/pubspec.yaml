name: backend
description: A server app using the shelf package and Docker.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.9.2

dependencies:
  bcrypt: ^1.2.0
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.4.1
  postgres: ^3.5.11
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  # H2: WebSocket support for per-page CRDT subscriptions
  # (lib/sync/ws_routes.dart). Hosted under /sync/sub/<ulid> behind
  # the same Bearer-JWT middleware as the rest of /sync.
  shelf_web_socket: ^3.0.0
  ulid: ^2.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  http: ^1.2.2
  # M1485: dropped lints in favor of very_good_analysis to align
  # with the Flutter-side baseline (TS-02 + LT-01 deferrals
  # confirmed at M1479 + M1482 + M1483 audits).
  #
  # mocktail is intentionally declared even though no current
  # backend test consumes it — present so the next test that
  # mocks a repository can use it without a pubspec roundtrip.
  # Audit precedent: M1485 orchestrator approved the preemptive
  # add. The M1491 audit re-flagged it as unused — that's the
  # explicit trade-off documented here (TS-02 vs YAGNI).
  mocktail: ^1.0.4
  test: ^1.25.6
  very_good_analysis: ^9.0.0
