name: my_notion
description: "Quill — a self-hosted, markdown-first Notion alternative."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State + DI + routing
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.0.0
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Codegen annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Database
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.27

  # Filesystem + paths
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^10.1.2

  # Markdown + YAML
  yaml: ^3.1.3
  yaml_writer: ^2.0.0
  markdown_widget: ^2.3.2+8
  super_editor: ^0.3.0-dev.25
  super_editor_markdown: ^0.1.6+1

  # Utilities
  ulid: ^2.0.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  archive: ^4.0.7
  google_fonts: ^6.3.2
  file: ^7.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ^2.26.0

  # Lints + test helpers
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
