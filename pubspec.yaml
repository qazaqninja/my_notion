name: my_notion
description: "Quill — a self-hosted, markdown-first Notion alternative."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # Alphabetical, with SDK-sourced packages grouped at the top.
  # Architectural notes:
  # - DI is widget-tree via flutter_bloc; no service-locator packages
  #   (DI-04 in docs/RULES.md).
  # - The markdown renderer is hand-rolled; super_editor and
  #   markdown_widget will land when WYSIWYG editing ships (see
  #   CLAUDE.md "v1.x backlog").
  flutter:
    sdk: flutter
  archive: ^4.0.7
  # bcrypt hashing for E44's "Publish with password…" flow — the
  # client hashes the chosen password before stamping it into
  # frontmatter, so the backend never sees the plaintext. Same
  # package the backend uses, pure-Dart so no native channel needed.
  bcrypt: ^1.2.0
  # WebSocket client for the H2.2 multiplayer sub — connects to
  # ws://<baseUrl>/sync/sub/<ulid>. Same package the backend uses
  # so the test seam is symmetric.
  web_socket_channel: ^3.0.1
  # SHA-256 hashing for the E31/E32 vault-wide bulk push (decides which
  # files need to be sent vs already match the server). Already pulled
  # in transitively by drift / http_parser; promoting to a direct dep
  # so the bulk-push code can `import 'package:crypto/crypto.dart'`.
  crypto: ^3.0.6
  # Inline audio playback for M201 audio cards (B2 of the 1m-loop plan).
  audioplayers: ^6.6.0
  # OS notifications for reminders (B4 of the 1m-loop plan). Capped at
  # ^20.1.0 — 21.x requires SDK ^3.10.0 (we have 3.9.2).
  flutter_local_notifications: ^20.1.0
  # Inline PDF first-page preview for M201 PDF cards (B3 of the 1m-loop plan).
  pdfx: ^2.9.2
  # Companion to flutter_local_notifications for scheduling at a specific
  # local time across DST/timezone boundaries.
  timezone: ^0.10.0
  # OS share-sheet integration (C3 of the 1m-loop plan). Capped at ^12.0.2
  # — 13.x requires SDK ^3.10.0 (we have 3.9.2).
  share_plus: ^12.0.2
  # Inbound share-sheet (F1) — companion to share_plus. Lets Safari/
  # Chrome/etc. push URLs + text into Quill, which appends them to
  # Inbox/Quick capture.md. Native side (iOS Share Extension + Android
  # intent-filter) wired in subsequent slices; this dep is the Dart
  # entry point.
  receive_sharing_intent: ^1.8.1
  # Home-screen "Add to Inbox" widget (G1) — iOS WidgetKit + Android
  # AppWidget bridge. The widget posts a single text payload over the
  # `home_widget` plugin's shared-data channel; Quill drains it via
  # the same IncomingShareSource interface as the share-sheet flow,
  # so widget-originated captures funnel through the existing
  # QuickCapture.append splice.
  home_widget: ^0.7.0
  # WYSIWYG editing (Phase D of the 1m-loop plan). 0.3-dev required
  # because 0.2.x pins http ^0.13 which conflicts with `timezone ^0.10.0`
  # (added in B4) needing http ^1.2. Used behind a feature flag at
  # /editor-beta/<ulid> alongside the existing source-mode editor.
  super_editor: 0.3.0-dev.44
  # WebView host for mermaid diagram rendering (C1 of the 1m-loop plan).
  # iOS / Android / macOS supported natively; Linux / Windows fall back to
  # the styled placeholder card (M200).
  webview_flutter: ^4.13.1
  # `bloc_concurrency` adds the named event transformers (droppable,
  # sequential, restartable) that flutter_bloc itself doesn't ship.
  # We use them to guard I/O-heavy handlers (editor open / save) from
  # concurrent fires under the default `concurrent` transformer — see
  # BL-10 in docs/RULES.md.
  bloc_concurrency: ^0.3.0
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  equatable: ^2.0.7
  file: ^7.0.1
  file_picker: ^10.1.2
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  flutter_math_fork: ^0.7.4
  go_router: ^16.0.0
  http: ^1.2.2
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.27
  table_calendar: ^3.2.0
  ulid: ^2.0.0
  # Inline video playback for M201 video cards (B1 of the 1m-loop plan).
  # Capped at ^2.10.0 — 2.11.x requires SDK ^3.10.0 (we have 3.9.2).
  video_player: ^2.10.0
  yaml: ^3.1.3
  yaml_writer: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  alchemist: ^0.12.1
  bloc_lint: ^0.3.7
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  custom_lint: ^0.8.0
  drift_dev: ^2.26.0
  flutter_dotenv: ^5.1.0
  mockingjay: ^2.0.0
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    # mermaid.min.js (3.3 MB) is vendored offline so the macOS app sandbox
    # doesn't block cdn.jsdelivr.net / unpkg.com. C1 slice 2 of the
    # 1m-loop plan.
    - assets/mermaid/mermaid.min.js
  fonts:
    - family: Inter
      fonts:
        # Variable font covers all weights from Thin to Black.
        - asset: assets/fonts/InterVariable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
