name: my_notion
description: "Quill — a self-hosted, markdown-first Notion alternative."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # Alphabetical, with SDK-sourced packages grouped at the top.
  # Architectural notes:
  # - DI is widget-tree via flutter_bloc; no service-locator packages
  #   (DI-04 in docs/RULES.md).
  # - The markdown renderer is hand-rolled; super_editor and
  #   markdown_widget will land when WYSIWYG editing ships (see
  #   CLAUDE.md "v1.x backlog").
  flutter:
    sdk: flutter
  archive: ^4.0.7
  # `bloc_concurrency` adds the named event transformers (droppable,
  # sequential, restartable) that flutter_bloc itself doesn't ship.
  # We use them to guard I/O-heavy handlers (editor open / save) from
  # concurrent fires under the default `concurrent` transformer — see
  # BL-10 in docs/RULES.md.
  bloc_concurrency: ^0.3.0
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  equatable: ^2.0.7
  file: ^7.0.1
  file_picker: ^10.1.2
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  flutter_math_fork: ^0.7.4
  go_router: ^16.0.0
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.27
  table_calendar: ^3.2.0
  ulid: ^2.0.0
  yaml: ^3.1.3
  yaml_writer: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  alchemist: ^0.12.1
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_dotenv: ^5.1.0
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        # Variable font covers all weights from Thin to Black.
        - asset: assets/fonts/InterVariable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
