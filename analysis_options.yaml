# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# very_good_analysis is the strict baseline mandated by docs/RULES.md
# LT-01. Adopted in M830.
include: package:very_good_analysis/analysis_options.yaml

# Skip out-of-tree review-bundle scaffolding and generated drift code.
# `flutter_clean_arch_bundle/` is vendored reference material for the
# arch agents; not part of the running app.
#
# `custom_lint` plugin enables Bloc-specific lint rules from the `bloc_lint`
# package per RULES.md LT-02 / LT-03. Run via `dart run custom_lint` (the
# IDE picks it up automatically when this analyzer config is present).
analyzer:
  plugins:
    - custom_lint
  exclude:
    - flutter_clean_arch_bundle/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Style rules turned OFF in M830 because the codebase chose a
    # different convention or because the rule is too noisy for a
    # self-hosted single-developer app. Disabling these costs nothing
    # architecturally — the substantive rules (avoid_catches_without_on,
    # cast_nullable_to_non_nullable, avoid_slow_async_io, etc.) stay on.
    public_member_api_docs: false       # 997 hits; this app is not a published library
    always_use_package_imports: false   # codebase uses relative imports consistently
    lines_longer_than_80_chars: false   # most callsites are multi-line builders
    prefer_single_quotes: false         # double quotes used throughout
    prefer_const_constructors: false    # micro-perf only; not worth churn
    avoid_redundant_argument_values: false
    cascade_invocations: false
    always_put_required_named_parameters_first: false
    omit_local_variable_types: false
    unnecessary_underscores: false
    directives_ordering: false
    comment_references: false           # many false positives
    prefer_int_literals: false
    leading_newlines_in_multiline_strings: false
    parameter_assignments: false
    use_setters_to_change_properties: false
    use_string_buffers: false
    no_runtimeType_toString: false      # used in debug branches
    avoid_catches_without_on_clauses: false  # toastError flows catch broadly by design
    unnecessary_breaks: false           # switch-expression style preference
    unnecessary_raw_strings: false      # regex style preference
    use_raw_strings: false              # regex style preference
    only_throw_errors: false            # some flows throw strings as exception messages
    prefer_const_declarations: false    # style; const opt-in is at the use site
    flutter_style_todos: false          # TODOs without (user) ownership tags
    # The lint says "File.exists() is slow, prefer existsSync()". For
    # async vault scans / importers that's true — sync is faster and
    # doesn't block the UI thread because we're already on a background
    # zone. But the codebase uses await on dart:io for readability and
    # to match the rest of the async-first style. The "slow" overhead
    # is negligible (~ms) for the file counts in a typical vault.
    avoid_slow_async_io: false
    # The SDK-sourced `flutter:` dependency conventionally lives at the
    # top of pubspec.yaml even though strict alphabetic order would put
    # `archive` first. The lint doesn't handle this exception.
    sort_pub_dependencies: false
