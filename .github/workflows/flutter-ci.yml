name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit on the same PR comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      # flutter_clean_arch_bundle/ is vendored reference material that
      # depends on custom_lint_builder (not in pubspec). The analyzer
      # excludes it via analysis_options.yaml.
      #
      # `--fatal-warnings` gates CI on warning + error severity. The
      # very_good_analysis baseline (M830) surfaces many info-level
      # lints that we triage incrementally — they print but do not
      # block merges. Promote to `--fatal-infos` once the info backlog
      # is cleared.
      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce coverage threshold (62%)
        # Baseline at M821 was 53.9%. Ratchet history:
        #   50 → 55 (M900) → 56 (M934) → 57 (M956) → 58 (M981)
        #     → 59 (M1024) → 60 (M1067) → 61 (M1110) → 62 (M1156).
        # M1156 bump triggered: M1155 measured 62.51%, M1156 measures
        # 62.53% — two consecutive observations ≥62.5% (per the rule
        # documented at M981) clears the 62 step. The M1110-M1156
        # extraction-family stretch was the main contributor: a
        # 46-milestone run added ~31 new well-tested regex extractors
        # (now 92 family members) lifting line-coverage from
        # 61.53% (M1109) to 62.53% (M1156).
        # Next ratchet (63) requires the same two-consecutive-≥63.5%
        # rule.
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 62

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
