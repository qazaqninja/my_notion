name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit on the same PR comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      # flutter_clean_arch_bundle/ is vendored reference material that
      # depends on custom_lint_builder (not in pubspec). The analyzer
      # excludes it via analysis_options.yaml.
      #
      # `--fatal-warnings` gates CI on warning + error severity. The
      # very_good_analysis baseline (M830) surfaces many info-level
      # lints that we triage incrementally — they print but do not
      # block merges. Promote to `--fatal-infos` once the info backlog
      # is cleared.
      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce coverage threshold (55%)
        # Baseline at M821 was 53.9% line coverage. By M900 the suite
        # covers 55.94% — bumping the gate from 50→55 catches genuine
        # regressions without flapping. Ratchet upward toward 75% as
        # more domain tests land.
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 55

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
